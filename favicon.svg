<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0b0d11"/>
  <defs>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- zombie head -->
  <rect x="6" y="3" width="20" height="17" rx="8" fill="#6f7d58"/>
  <rect x="5" y="9" width="22" height="11" rx="5.5" fill="#6f7d58"/>
  <!-- jaw -->
  <rect x="9" y="21" width="14" height="6" rx="3" fill="#5f6d4a"/>
  <!-- teeth -->
  <rect x="11" y="21" width="2.2" height="3.4" rx="0.6" fill="#cfd6c0"/>
  <rect x="14.9" y="21" width="2.2" height="3.4" rx="0.6" fill="#cfd6c0"/>
  <rect x="18.8" y="21" width="2.2" height="3.4" rx="0.6" fill="#cfd6c0"/>
  <!-- glowing red eyes -->
  <g filter="url(#g)">
    <rect x="9" y="10.5" width="5" height="4" rx="0.8" fill="#ff2a1a"/>
    <rect x="18" y="10.5" width="5" height="4" rx="0.8" fill="#ff2a1a"/>
  </g>
</svg>
